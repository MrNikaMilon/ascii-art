name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            multiplayer/requirements.txt
            multiplayer/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r multiplayer/requirements-dev.txt

      - name: Check terminal game syntax
        run: python -m py_compile fly_game.py

      - name: Run multiplayer tests
        run: python -m pytest multiplayer/tests
