services:
  game:
    build: .
    image: last-fly-standing
    restart: unless-stopped
    # Not published to the internet: only Caddy can reach it.
    expose:
      - "8080"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the server's public IP}
      ACME_PROFILE: ${ACME_PROFILE:-shortlived}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates must survive restarts, or every deploy requests new ones.
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
