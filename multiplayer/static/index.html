<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d0f">
<title>Last Fly Standing</title>
<style>
:root {
  --bg: #0b0d0f; --panel: #14181c; --line: #2b3238; --text: #e7e2d8;
  --muted: #8d969e; --accent: #fde047; --danger: #f87171;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--mono); overflow: hidden; }
[hidden] { display: none !important; }
button, input { font: inherit; }
button {
  min-height: 42px; padding: 8px 16px; color: #15130a; background: var(--accent);
  border: 0; border-radius: 3px; font-weight: 700; cursor: pointer;
}
button.ghost { color: var(--text); background: transparent; border: 1px solid var(--line); }
button:disabled { color: var(--muted); background: var(--line); cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#home { height: 100%; display: grid; place-items: center; padding: 16px; overflow: auto; }
.home-card { width: min(100%, 430px); }
.logo { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.2; white-space: pre; }
.logo b { color: #4ade80; font-weight: 400; } .logo i { color: var(--accent); font-style: normal; }
h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.15; }
.lead { margin: 0 0 22px; color: var(--muted); }
label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; height: 42px; padding: 0 12px; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
}
.error { min-height: 22px; margin: 10px 0 0; color: var(--danger); font-size: 13px; }

#play { position: fixed; inset: 0; }
#hud { position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); z-index: 2;
  display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; background: rgba(7, 9, 10, .78); border-radius: 3px; }
.party { display: flex; align-items: center; gap: 12px; }
#bossBar { width: min(100%, 600px); align-self: center; }
.boss-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; font-size: 13px; }
.boss-label strong { color: var(--danger); letter-spacing: 3px; }
#bossHealth { height: 12px; overflow: hidden; background: #32191c; border: 1px solid #74343b; border-radius: 2px; }
#bossFill { width: 100%; height: 100%; background: #ef4444; transition: width .15s linear; }
#roundLabel { color: var(--muted); white-space: nowrap; }
#scores { display: flex; gap: 6px 14px; flex: 1; flex-wrap: wrap; min-width: 0; max-height: 20vh; overflow: auto; }
.score { white-space: nowrap; font-size: 13px; }
.score.out { opacity: .45; text-decoration: line-through; }
#stageWrap { position: absolute; inset: 0; }
#stage { position: absolute; inset: 0; }
canvas { display: block; width: 100%; height: 100%; background: #07090a; }
#overlay { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; padding: 60px 12px 36px; pointer-events: none; }
.panel {
  width: min(100%, 440px); max-height: 100%; overflow: auto; padding: 18px; text-align: center;
  background: rgba(16, 19, 22, .96); border: 1px solid var(--line); pointer-events: auto;
}
.panel h2 { margin: 0 0 8px; font-size: 21px; line-height: 1.2; }
.panel p { margin: 0 0 12px; color: var(--muted); }
.panel .row { margin-bottom: 12px; }
.panel input { font-size: 13px; }
#count { color: var(--accent); font-size: clamp(44px, 10vw, 96px); font-weight: 700; text-shadow: 0 0 18px #000; }
#banner { padding: 8px 16px; color: var(--accent); background: rgba(7, 9, 10, .9); font-size: clamp(16px, 2.6vw, 26px); font-weight: 700; text-align: center; }
#status { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); left: 12px; right: 12px; z-index: 2;
  width: fit-content; max-width: calc(100% - 24px); margin: 0 auto; padding: 3px 8px; color: var(--muted); background: rgba(7, 9, 10, .78); border-radius: 3px; font-size: 13px; text-align: center; pointer-events: none; }
#status:empty { display: none; }

#pad { display: none; position: fixed; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 5;
  grid-template: repeat(3, 50px) / repeat(3, 50px); gap: 3px; opacity: .88; touch-action: none; user-select: none; -webkit-user-select: none; }
#pad button { min-height: 0; padding: 0; color: var(--text); background: rgba(40, 46, 52, .9); border: 1px solid #4a535b; font-size: 20px; }
#pad button.down { color: #15130a; background: var(--accent); }
#attackBtn { display: none; position: fixed; left: 14px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5; min-height: 64px; min-width: 88px; touch-action: manipulation; }
@media (pointer: coarse) {
  body:has(#play:not([hidden])) #pad { display: grid; }
  body:has(#play:not([hidden])) #attackBtn { display: block; }
}
</style>
</head>
<body>
<main id="home">
  <div class="home-card">
    <div class="logo" aria-hidden="true">   (o o)            <b>._q0p_.</b>
   ( ᴗ )            <b>'=(_)='</b>      <i>&lt;==8</i>
  /ТИМУР\            <b>/ V \</b>   <i>&lt;==8</i></div>
    <h1>Last Fly Standing</h1>
    <p class="lead" id="lead">Dodge the arrows. Escape Тимур's tongue. Defeat the boss together.</p>
    <form id="joinForm">
      <label for="name">Your nickname</label>
      <div class="row">
        <input id="name" maxlength="12" autocomplete="nickname" required>
        <button id="joinBtn" type="submit">Create room</button>
      </div>
      <p class="error" id="homeError" role="alert"></p>
    </form>
  </div>
</main>

<main id="play" hidden>
  <header id="hud">
    <div id="bossBar">
      <div class="boss-label"><strong>ТИМУР</strong><span id="bossHp">300 / 300 HP</span></div>
      <div id="bossHealth" role="progressbar" aria-label="Тимур HP" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300"><div id="bossFill"></div></div>
    </div>
    <div class="party"><span id="roundLabel"></span><div id="scores"></div></div>
  </header>
  <div id="stageWrap">
    <div id="stage">
      <canvas id="canvas" aria-label="Game arena"></canvas>
      <div id="overlay">
        <section class="panel" id="lobby" hidden>
          <h2 id="lobbyTitle">Room ready</h2>
          <p id="lobbyText"></p>
          <div class="row">
            <input id="shareLink" readonly aria-label="Room link">
            <button class="ghost" id="copyBtn" type="button">Copy</button>
          </div>
          <button id="startBtn" type="button">Start match</button>
        </section>
        <div id="count" hidden></div>
        <div id="banner" hidden></div>
      </div>
    </div>
  </div>
  <div id="status" role="status"></div>
</main>
<div id="pad" aria-label="Movement controls">
  <span></span><button data-d="up" aria-label="Up">↑</button><span></span>
  <button data-d="left" aria-label="Left">←</button><span></span><button data-d="right" aria-label="Right">→</button>
  <span></span><button data-d="down" aria-label="Down">↓</button><span></span>
</div>
<button id="attackBtn" type="button" aria-label="Shoot at Тимур" disabled>● Fire</button>

<script>
"use strict";
const W = 200, H = 60, FLY_W = 7, FLY_H = 4, SPEED_X = 38, SPEED_Y = 19;
const MAN_W = 21, MAN_H = 13;
const MAN_X = Math.floor((W - MAN_W) / 2), MAN_Y = Math.floor((H - MAN_H) / 2);
const MOUTH_X = MAN_X + 10, MOUTH_Y = MAN_Y + 5;
const ATTACK_COOLDOWN_MS = 500;
const COLORS = ["#4ade80", "#38bdf8", "#f472b6", "#c084fc", "#fb923c", "#f5f5f4"];
const playerColor = index => COLORS[index] || `hsl(${(index * 137.508) % 360} 75% 70%)`;
// Same order as DIRECTIONS in game.py; each drawing runs from tip to tail.
const ARROWS = [
  [-1, 0, "<==8"], [1, 0, ">==8"], [0, -1, "^||8"], [0, 1, "v||8"],
  [-1, -1, "^\\\\8"], [1, -1, "^//8"], [-1, 1, "v//8"], [1, 1, "v\\\\8"],
];
const FLY = ["._q0p_.", "'=(_)='", " / V \\ ", "(_/^\\_)"];
const MAN = [
  "    .___________.",
  "   /   _______   \\",
  "  /   /       \\   \\",
  " |   |  o   o  |   |",
  "[|   |   ___   |   |]",
  "[|   |  \\___/  |   |]",
  " |    \\_______/    |",
  "  \\_____|||||_____/",
  "       /|||||\\",
  "     _/_______\\_",
  "    /           \\",
  "   /    ТИМУР    \\",
  "  /_______________\\",
];
const FACES = {
  smile: {},
  open: { 5: "[|   |  (   )  |   |]", 6: " |    \\_(___)_/    |" },
  sad: { 5: "[|   |  /   \\  |   |]" },
  warn: { 3: " |   |  O   O  |   |", 5: "[|   |  (   )  |   |]", 6: " |    \\_(___)_/    |" },
  tongue: { 3: " |   |  >   <  |   |", 5: "[|   |  (   )  |   |]", 6: " |    \\_(___)_/    |" },
};

const $ = id => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const store = {
  get(area, key) { try { return window[area].getItem(key); } catch { return null; } },
  set(area, key, value) { try { window[area].setItem(key, value); } catch {} },
  remove(area, key) { try { window[area].removeItem(key); } catch {} },
};

let roomCode = (location.pathname.match(/^\/r\/([A-Za-z0-9]{6})$/) || [])[1]?.toUpperCase() || null;
let socket = null, myId = null, state = null, fatal = false, retry = 0;
let predicted = null, lastFrame = performance.now(), cw = 8, ch = 16;
const held = new Set();
let sentDx = 0, sentDy = 0;
let nextAttackAt = 0;

function tokenKey() { return `lfs-token-${roomCode}`; }
function showHome(error = "") {
  $("home").hidden = false; $("play").hidden = true; $("homeError").textContent = error;
  $("joinBtn").disabled = false;
  $("joinBtn").textContent = roomCode ? "Join room" : "Create room";
}
function showPlay() { $("home").hidden = true; $("play").hidden = false; resize(); }

$("name").value = store.get("localStorage", "lfs-name") || "";
$("joinForm").addEventListener("submit", async event => {
  event.preventDefault();
  const name = $("name").value.trim();
  if (!name) return;
  store.set("localStorage", "lfs-name", name);
  $("joinBtn").disabled = true; $("homeError").textContent = "";
  try {
    if (!roomCode) {
      const response = await fetch("/api/rooms", { method: "POST" });
      if (!response.ok) throw new Error();
      roomCode = (await response.json()).code;
      history.replaceState(null, "", `/r/${roomCode}`);
    }
    connect(name);
  } catch {
    showHome("Could not create a room. Try again.");
  }
});

function connect(name) {
  fatal = false;
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws/${roomCode}`);
  socket = ws;
  ws.onopen = () => {
    ws.send(JSON.stringify({ t: "join", name, token: store.get("sessionStorage", tokenKey()) || undefined }));
  };
  ws.onmessage = event => {
    const message = JSON.parse(event.data);
    if (message.t === "welcome") {
      myId = message.id; retry = 0;
      store.set("sessionStorage", tokenKey(), message.token);
      $("shareLink").value = `${location.origin}/r/${message.code}`;
      $("status").textContent = "";
      showPlay();
    } else if (message.t === "state") {
      state = message; updateUi();
    } else if (message.t === "error") {
      fatal = true;
      if (message.reason === "not_found") {
        store.remove("sessionStorage", tokenKey());
        roomCode = null; history.replaceState(null, "", "/");
        showHome("That room no longer exists. Create a new one.");
      } else {
        showHome("Please enter a valid nickname.");
      }
    }
  };
  ws.onclose = event => {
    if (socket !== ws || fatal) return;
    if (event.code === 4000) {
      fatal = true; $("status").textContent = "This game was opened in another tab."; return;
    }
    if ($("play").hidden) { showHome("Could not connect. Try again."); return; }
    $("status").textContent = "Connection lost. Reconnecting…";
    retry = Math.min(retry + 1, 5);
    setTimeout(() => connect(name), 400 * retry);
  };
}

function send(message) {
  if (socket?.readyState !== WebSocket.OPEN) return false;
  socket.send(JSON.stringify(message));
  return true;
}
function attack() {
  const me = state?.players.find(p => p.id === myId);
  const now = performance.now();
  if (state?.phase !== "playing" || !me?.alive || now < nextAttackAt) return;
  if (send({ t: "attack" })) nextAttackAt = now + ATTACK_COOLDOWN_MS;
}
function syncInput() {
  const dx = (held.has("right") ? 1 : 0) - (held.has("left") ? 1 : 0);
  const dy = (held.has("down") ? 1 : 0) - (held.has("up") ? 1 : 0);
  if (dx !== sentDx || dy !== sentDy) {
    sentDx = dx; sentDy = dy; send({ t: "input", dx, dy });
  }
}
const KEYS = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
addEventListener("keydown", event => {
  if (["INPUT", "TEXTAREA"].includes(event.target.tagName) || $("play").hidden) return;
  if (event.code === "Space") {
    event.preventDefault();
    if (!event.repeat) attack();
    return;
  }
  const dir = KEYS[event.code];
  if (!dir) return;
  event.preventDefault(); held.add(dir); syncInput();
});
addEventListener("keyup", event => {
  const dir = KEYS[event.code];
  if (dir) { held.delete(dir); syncInput(); }
});
addEventListener("blur", () => { held.clear(); syncInput(); });
document.querySelectorAll("#pad button").forEach(button => {
  const dir = button.dataset.d;
  const down = event => { event.preventDefault(); button.setPointerCapture?.(event.pointerId); held.add(dir); button.classList.add("down"); syncInput(); };
  const up = () => { held.delete(dir); button.classList.remove("down"); syncInput(); };
  button.addEventListener("pointerdown", down);
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => button.addEventListener(type, up));
});

$("startBtn").addEventListener("click", () => send({ t: "start" }));
$("attackBtn").addEventListener("click", attack);
$("copyBtn").addEventListener("click", async () => {
  const input = $("shareLink");
  try { await navigator.clipboard.writeText(input.value); }
  catch { input.select(); document.execCommand?.("copy"); }
  $("copyBtn").textContent = "Copied";
  setTimeout(() => { $("copyBtn").textContent = "Copy"; }, 1400);
});

function updateUi() {
  const me = state.players.find(p => p.id === myId);
  const isHost = state.host === myId;
  const connected = state.players.filter(p => p.connected).length;
  $("roundLabel").textContent = state.round ? `Attempt ${state.round}` : "Lobby";
  $("bossHp").textContent = `${state.boss.hp} / ${state.boss.max_hp} HP`;
  $("bossFill").style.width = `${100 * state.boss.hp / state.boss.max_hp}%`;
  $("bossHealth").setAttribute("aria-valuenow", state.boss.hp);
  $("bossHealth").setAttribute("aria-valuemax", state.boss.max_hp);

  const scores = $("scores");
  scores.replaceChildren(...state.players.map(p => {
    const el = document.createElement("span");
    const racing = ["countdown", "playing"].includes(state.phase);
    el.className = "score" + ((racing && !p.alive) || !p.connected ? " out" : "");
    el.style.color = playerColor(p.color);
    el.textContent = p.name + (p.id === myId ? " (you)" : "") + (p.id === state.host ? " ★" : "");
    return el;
  }));

  const showPanel = state.phase === "lobby" || state.phase === "match_over";
  $("lobby").hidden = !showPanel;
  if (showPanel) {
    const over = state.phase === "match_over";
    $("lobbyTitle").textContent = over ? state.message : "Room ready";
    const notice = !over && state.message ? `${state.message}. ` : "";
    $("lobbyText").textContent = notice + (connected === 1
      ? "Play solo or share this link with friends."
      : `${connected} players here. ` + (isHost ? "Start when everyone is in." : "Waiting for the host to start."));
    $("startBtn").hidden = !isHost;
    $("startBtn").disabled = connected < 1;
    $("startBtn").textContent = over ? "Rematch" : "Start match";
  }
  $("count").hidden = state.phase !== "countdown";
  if (state.phase === "countdown") $("count").textContent = Math.max(1, Math.ceil(state.timer));
  const banner = state.phase === "round_over" ? state.message : "";
  $("banner").hidden = !banner; $("banner").textContent = banner;

  if ($("status").textContent.startsWith("Connection")) return;
  if (state.phase === "playing" && me && !me.alive) $("status").textContent = "You're out. Spectating until the next attempt.";
  else if (state.feed) $("status").textContent = state.feed;
  else if (state.phase === "playing") $("status").textContent = "Arrows / WASD to move · Space to shoot";
  else $("status").textContent = "";
}

function resize() {
  const wrap = $("stageWrap").getBoundingClientRect();
  if (!wrap.width || !wrap.height) return;
  cw = wrap.width / W;
  ch = wrap.height / H;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * cw * dpr); canvas.height = Math.round(H * ch * dpr);
  canvas.style.width = `${W * cw}px`; canvas.style.height = `${H * ch}px`;
  ctx.setTransform(canvas.width / (W * cw), 0, 0, canvas.height / (H * ch), 0, 0);
}
addEventListener("resize", resize);

function put(text, col, row, color) {
  ctx.fillStyle = color;
  for (let i = 0; i < text.length; i++) {
    if (text[i] !== " ") ctx.fillText(text[i], (col + i + .5) * cw, (row + .5) * ch);
  }
}
function drawTongue(t, time) {
  if (t.state === "warn") {
    const [x, y] = t.spot;
    // Blinks while tracking; turns solid red when the aim locks: move now!
    const color = t.locked || Math.floor(time / 70) % 2 ? "#ef4444" : "#fde047";
    put(t.locked ? "[#]" : "[X]", x - 1, y, color);
    const label = `!! ${t.name} !!`;
    put(label, Math.max(0, Math.min(W - label.length, x - Math.floor(label.length / 2))), y >= 4 ? y - 4 : y + 3, color);
  } else if (["extend", "hold", "retract"].includes(t.state)) {
    const [tx, ty] = t.tip;
    const steps = Math.max(Math.abs(tx - MOUTH_X), Math.abs(ty - MOUTH_Y), 1);
    for (let i = 1; i <= steps; i++) {
      const col = Math.round(MOUTH_X + (tx - MOUTH_X) * i / steps);
      const row = Math.round(MOUTH_Y + (ty - MOUTH_Y) * i / steps);
      put(i === steps ? "@" : "~", col, row, "#f87171");
    }
    if (t.state !== "retract" && (tx !== MOUTH_X || ty !== MOUTH_Y)) {   // matches TONGUE_SPLASH in game.py
      put("@@@", tx - 1, ty - 1, "#ef4444");
      put("@@@@@", tx - 2, ty, "#ef4444");
      put("@@@", tx - 1, ty + 1, "#ef4444");
    }
  }
}
// Keep prediction aligned with move_fly() on the server, including the central obstacle.
function moveFly(pos, dx, dy, dt) {
  let x = Math.max(0, Math.min(W - FLY_W, pos.x + dx * SPEED_X * dt));
  if (pos.y < MAN_Y + MAN_H && pos.y + FLY_H > MAN_Y) {
    if (pos.x + FLY_W <= MAN_X && x + FLY_W > MAN_X) x = MAN_X - FLY_W;
    else if (pos.x >= MAN_X + MAN_W && x < MAN_X + MAN_W) x = MAN_X + MAN_W;
  }
  let y = Math.max(0, Math.min(H - FLY_H, pos.y + dy * SPEED_Y * dt));
  if (x < MAN_X + MAN_W && x + FLY_W > MAN_X) {
    if (pos.y + FLY_H <= MAN_Y && y + FLY_H > MAN_Y) y = MAN_Y - FLY_H;
    else if (pos.y >= MAN_Y + MAN_H && y < MAN_Y + MAN_H) y = MAN_Y + MAN_H;
  }
  return { x, y };
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastFrame) / 1000); lastFrame = now;
  if (!state || $("play").hidden) return;
  $("attackBtn").disabled = state.phase !== "playing" ||
    !state.players.find(p => p.id === myId)?.alive || now < nextAttackAt;
  ctx.clearRect(0, 0, W * cw, H * ch);
  ctx.font = `${Math.min(cw / .6, ch)}px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  const face = FACES[state.face] || {};
  const bossColor = state.boss.hp === 0 ? "#64748b" : state.boss.hit ? "#f87171" : "#e7e2d8";
  MAN.forEach((line, i) => put(face[i] || line, MAN_X, MAN_Y + i, bossColor));
  state.balls.forEach(([x, y, color]) => put("●", x, y, playerColor(color)));
  state.arrows.forEach(([x, y, d]) => {
    const [dx, dy, art] = ARROWS[d];
    for (let i = 0; i < art.length; i++) put(art[i], x - i * dx, y - i * dy, "#fde047");
  });

  const me = state.players.find(p => p.id === myId);
  if (me?.alive && state.phase === "playing") {
    if (!predicted) predicted = { x: me.x, y: me.y };
    predicted = moveFly(predicted, sentDx, sentDy, dt);
    const pull = Math.min(1, dt * 10);
    predicted.x += (me.x - predicted.x) * pull; predicted.y += (me.y - predicted.y) * pull;
  } else predicted = null;

  state.players.filter(p => p.alive).forEach(p => {
    const pos = p.id === myId && predicted ? predicted : p;
    const col = Math.floor(pos.x), row = Math.floor(pos.y), color = playerColor(p.color);
    FLY.forEach((line, i) => put(line, col, row + i, color));
    const tag = p.id === myId ? `▼ ${p.name}` : p.name;
    const tagCol = Math.max(0, Math.min(W - tag.length, col + 3 - Math.floor(tag.length / 2)));
    put(tag, tagCol, row > 0 ? row - 1 : row + FLY_H, color);
  });
  drawTongue(state.tongue, now);
}
requestAnimationFrame(frame);

(async () => {
  if (!roomCode) { showHome(); return; }
  try {
    const response = await fetch(`/api/rooms/${roomCode}`);
    if (!response.ok) throw new Error();
    $("lead").textContent = `You've been invited to room ${roomCode}.`;
    showHome();
    const savedName = store.get("localStorage", "lfs-name");
    if (store.get("sessionStorage", tokenKey()) && savedName) connect(savedName);
  } catch {
    roomCode = null; history.replaceState(null, "", "/");
    showHome("That room doesn't exist or has expired.");
  }
})();
</script>
</body>
</html>
